name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: typecheck + unit tests
        working-directory: ts
        run: |
          pnpm exec tsc --noEmit
          pnpm exec tsx --test src/*.test.ts

      - name: self-spec typechecks
        run: cd spec && ./node_modules/.bin/codeform check spec.ts

      - name: examples conform
        run: |
          for d in account hangman; do
            (cd "examples/$d" && ../node_modules/.bin/codeform check spec.ts)
          done
